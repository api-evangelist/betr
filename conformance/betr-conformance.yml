generated: '2026-07-31'
method: searched
source: https://www.betr.app/ + anonymous probes of every Betr host, 2026-07-31
scope: |
  Betr publishes no public developer API program and no machine-readable contract, so
  the API-side standards below are recorded as not-applicable rather than failing:
  there is no OpenAPI, AsyncAPI, GraphQL SDL, MCP server or A2A agent card to evaluate.
  Only the discovery- and posture-level standards that CAN be observed anonymously are
  graded here.
standards:
- id: llmstxt
  name: llms.txt (AI discovery file)
  conforms: true
  evidence: 'https://www.betr.app/llms.txt returns HTTP 200 with a well-formed llms.txt
    (H1 + blockquote summary + sectioned link lists). A second llms.txt is emitted by
    the Intercom help center at https://help.betr.app/llms.txt (HTTP 200).'
- id: rfc9116-security-txt
  name: RFC 9116 security.txt
  conforms: false
  evidence: 'No first-party security.txt on any Betr host. www.betr.app/.well-known/security.txt
    = 404, api.betr.app = 403. The only 200 (help.betr.app) is Intercom''s vendor policy
    with Canonical https://app.intercom.com/.well-known/security.txt — not a Betr program.'
- id: rfc8615-well-known
  name: RFC 8615 /.well-known/ discovery
  conforms: false
  evidence: No first-party /.well-known/ document on any host; www.betr.app returns
    "Invalid .well-known request" (404) for every path.
- id: a2a-agent-card
  name: A2A Agent Card
  conforms: false
  evidence: /.well-known/agent-card.json and /.well-known/agent.json probed on all five
    hosts — 404 (www, help), 403 (api, staging), and an SPA catch-all HTML 200 on picks.betr.app
    that was rejected as a false positive.
- id: openapi
  name: OpenAPI
  conforms: false
  evidence: /openapi.json, /openapi.yaml, /swagger.json, /v1/openapi.json, /api-docs,
    /docs and /redoc probed on api.betr.app, www.betr.app, picks.betr.app, help.betr.app
    and stage1-backoffice-api-docs.betr.app. No path returned a parseable OpenAPI or
    Swagger document.
- id: oauth2
  name: OAuth 2.0
  conforms: null
  evidence: Not determinable anonymously — no public contract and no /.well-known/oauth-authorization-server.
    Betr's consumer apps authenticate against a private backend (api.betr.app returns
    a Symfony "There is currently no session available." error to anonymous callers).
- id: oidc
  name: OpenID Connect
  conforms: null
  evidence: /.well-known/openid-configuration returns 404 on www.betr.app and is not
