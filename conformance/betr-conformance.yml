- id: tls13
  name: TLS 1.3
  conforms: true
  evidence: All five probed hosts negotiate TLSv1.3 (see security/betr-domain-security.yml).
- id: hsts
  name: HTTP Strict Transport Security
  conforms: false
  evidence: 'Partial only: HSTS is present on picks.betr.app (max-age=63072000) and the
