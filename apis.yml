x-contract-discovery:
  date: '2026-07-31'
  result: no-public-machine-readable-contract
  note: Betr is a consumer gaming operator with no published developer program. Every
    contract-discovery probe below was run anonymously on 2026-07-31 and recorded with
    its HTTP status; none yielded a parseable OpenAPI, Swagger, GraphQL SDL, MCP tools/list
    or A2A agent card.
  hosts_probed:
  - host: api.betr.app
    note: 'Live private API backend (Symfony). Every path returns HTTP 500 {"message":"There
      is currently no session available."} or 403; /openapi.json, /openapi.yaml, /swagger.json,
      /v1/openapi.json, /docs, /redoc, /api-docs all miss. No anonymous contract.'
  - host: stage1-backoffice-api-docs.betr.app
    note: Real staging back-office API documentation host (AWS ELB, us-east-1) surfaced
      by search, but returns HTTP 403 Forbidden on every path including the root, with
      or without a browser user-agent. Internal/IP-restricted; not a public contract.
  - host: www.betr.app
    note: Webflow marketing site. /llms.txt returns HTTP 200 (harvested). All /.well-known/*
      paths return HTTP 404 "Invalid .well-known request". No spec paths.
  - host: picks.betr.app
    note: Betr Picks SPA. Returns HTTP 200 with the same 473-byte HTML shell for EVERY
      path including /.well-known/agent-card.json and /openapi.json — rejected as an
      SPA catch-all false positive, not a real artifact.
  - host: help.betr.app
    note: Intercom-hosted help center. /llms.txt returns HTTP 200 (harvested). /.well-known/security.txt
      returns HTTP 200 but is Intercom's own vendor policy (Canonical - app.intercom.com),
      not a Betr disclosure program.
