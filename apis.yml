aid: betr
name: Betr
description: 'Betr (Betr Holdings, Inc.) is a Miami-based real-money gaming and sports
  media company founded in 2022 by Joey Levy and Jake Paul on a $50M Series A. Betr
  operates a consumer "real money gaming super app" spanning Betr Picks (real-money
  pick''em daily fantasy sports across NFL, NBA, MLB, NHL, UFC and golf), a micro-betting
  sportsbook launched in Ohio in January 2023, a social sportsbook and social casino,
  Betr Arcade, and Betr Media (podcasts, creator content and digital sports programming).
  Betr is a business-to-consumer operator: it publishes mobile apps, a Webflow marketing
  site, an Intercom-hosted help center and an llms.txt discovery file, but as of this
  profiling round it publishes no public developer API program, no OpenAPI/AsyncAPI/GraphQL
  contract, and no SDKs. Its API hosts (api.betr.app, and a staging back-office API
  documentation host) are private and return 500/403 to anonymous callers.'
